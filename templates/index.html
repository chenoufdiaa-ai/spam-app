<!DOCTYPE html>
<html>

<head>
    <title>Spam Detector</title>

    <style>

        body {
            background-color: #121212;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            text-align: center;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        h1 {
            color: #00ff99;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            border: none;
            padding: 10px;
            font-size: 16px;
            resize: none;
        }

        button {
            background-color: #00ff99;
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.8;
        }

        h2 {
            margin-top: 20px;
        }

        .footer {
            margin-top: 25px;
            color: #aaaaaa;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Spam Detector</h1>

        <form method="POST">

            <textarea
                name="message"
                placeholder="Enter message here...">{{ message }}</textarea>

            <br>

            <button type="submit">Check Message</button>

        </form>

        <h2>{{ prediction }}</h2>

        <div class="footer">
            Created by <br>
            Chenouf Dhia Eddine & Berdaa Ayoub
        </div>

    </div>

</body>

</html>
